<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeekInsight Settings</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f7f8fc;color:#1a202c;min-height:100vh;padding:32px 16px}
    .container{max-width:520px;margin:0 auto}
    h1{font-size:22px;font-weight:700;color:#6366f1;margin-bottom:4px}
    .sub{font-size:13px;color:#718096;margin-bottom:28px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:16px}
    .card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6366f1;margin-bottom:14px}
    label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:#2d3748}
    .hint{font-size:11px;color:#a0aec0;margin-top:2px;margin-bottom:10px}
    select,input[type="text"],input[type="password"]{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;color:#1a202c;background:#fff;outline:none;margin-bottom:2px}
    select:focus,input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
    .row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0}
    .row:last-child{border-bottom:none}
    .toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#cbd5e0;border-radius:22px;cursor:pointer;transition:.25s}
    .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}
    input:checked+.slider{background:#6366f1}
    input:checked+.slider:before{transform:translateX(18px)}
    .delay-opts{display:flex;gap:8px;margin-top:2px}
    .delay-opts button{flex:1;padding:6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:#4a5568;transition:.15s}
    .delay-opts button.active,.delay-opts button:hover{border-color:#6366f1;color:#6366f1;background:#eef2ff}
    .save-btn{display:block;width:100%;padding:10px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
    .save-btn:hover{background:#4f46e5}
    .saved{color:#38a169;font-size:13px;text-align:center;height:20px;margin-top:8px}
    #keyField,#urlField{display:none}
    #keyField.show,#urlField.show{display:block}
  </style>
</head>
<body>
<div class="container">
  <h1>PeekInsight</h1>
  <p class="sub">AI link previews — all client-side, zero backend.</p>

  <div class="card">
    <h2>Toggles</h2>
    <div class="row">
      <label style="margin:0">Enable hover preview</label>
      <label class="toggle"><input type="checkbox" id="enabled"><span class="slider"></span></label>
    </div>
    <div class="row">
      <label style="margin:0">Enable AI enhancement</label>
      <label class="toggle"><input type="checkbox" id="aiEnabled"><span class="slider"></span></label>
    </div>
  </div>

  <div class="card">
    <h2>AI Provider</h2>
    <label for="provider">Provider</label>
    <select id="provider">
      <option value="pollinations">Pollinations (free, no key)</option>
      <option value="openrouter">OpenRouter (free models with key)</option>
      <option value="gemini">Google Gemini (1500 req/day free)</option>
      <option value="custom">Custom endpoint (OpenAI-compatible)</option>
    </select>
    <p class="hint">Pollinations works out of the box — no sign-up needed.</p>

    <div id="keyField">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
      <p class="hint" id="keyHint"></p>
    </div>

    <div id="urlField">
      <label for="customUrl">Base URL</label>
      <input type="text" id="customUrl" placeholder="https://api.example.com/v1">
      <p class="hint">Must be OpenAI-compatible (/chat/completions).</p>
    </div>
  </div>

  <div class="card">
    <h2>Hover Delay</h2>
    <div class="delay-opts">
      <button data-ms="300" id="d300">300 ms</button>
      <button data-ms="500" id="d500">500 ms</button>
      <button data-ms="1000" id="d1000">1000 ms</button>
    </div>
  </div>

  <button class="save-btn" id="save">Save Settings</button>
  <p class="saved" id="savedMsg"></p>
</div>
<script src="options.js"></script>
</body>
</html>
