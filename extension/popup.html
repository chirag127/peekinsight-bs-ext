<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeekInsight</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;width:300px;background:#fff;color:#1a202c}
    .top{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px}
    .logo{width:28px;height:28px}
    .brand{font-size:16px;font-weight:700;color:#6366f1}
    .version{font-size:10px;color:#a0aec0;align-self:flex-end;margin-bottom:1px}
    .body{padding:14px 16px}
    .row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f5f5f5}
    .row:last-child{border:none}
    .rlabel{font-size:13px;color:#2d3748}
    .toggle{position:relative;display:inline-block;width:38px;height:20px}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#cbd5e0;border-radius:20px;cursor:pointer;transition:.2s}
    .slider:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    input:checked+.slider{background:#6366f1}
    input:checked+.slider:before{transform:translateX(18px)}
    .provider-row{padding:10px 0 4px;display:flex;align-items:center;justify-content:space-between}
    .plabel{font-size:11px;color:#a0aec0}
    .pbadge{font-size:11px;font-weight:600;color:#6366f1;background:#eef2ff;padding:2px 8px;border-radius:20px}
    .footer{padding:10px 16px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end}
    .opts-btn{font-size:12px;color:#6366f1;background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;cursor:pointer;transition:.15s}
    .opts-btn:hover{background:#eef2ff}
    #summary{padding:10px 16px;font-size:12px;color:#4a5568;line-height:1.5;background:#f7f8fc;border-top:1px solid #f0f0f0;display:none}
    #summary.show{display:block}
    .spin{width:18px;height:18px;margin:2px auto;border:2px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="top">
    <img src="icons/icon48.png" class="logo" alt="">
    <span class="brand">PeekInsight</span>
    <span class="version" id="ver"></span>
  </div>
  <div class="body">
    <div class="row">
      <span class="rlabel">Hover preview</span>
      <label class="toggle"><input type="checkbox" id="enabled"><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="rlabel">AI enhancement</span>
      <label class="toggle"><input type="checkbox" id="aiEnabled"><span class="slider"></span></label>
    </div>
    <div class="provider-row">
      <span class="plabel">Active provider</span>
      <span class="pbadge" id="providerBadge">Pollinations</span>
    </div>
  </div>
  <div id="summary"></div>
  <div class="footer">
    <button class="opts-btn" id="openOpts">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
